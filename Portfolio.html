<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моето портфолио</title>
<style>

  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background-color: #f5f5f0;
    color: #222;
    line-height: 1.6;
  }

  .container {
    max-width: 700px;
    margin: 0 auto ;
    padding: 40px 20px;
  }

  h1 {
    color: darkblue;
    margin-bottom: 5px;
  }

  h2 {
    color: darkblue;
    margin-top: 40px;
  }

  a {
    color: darkblue;
  }

  .skill {
    display: inline-block;
    background-color: darkblue;
    color: white;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.9em;
    margin: 4px 4px 0 0;
  }

  .project {
    background-color: white;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px 20px;
    margin-top: 15px;
  }

</style>
</head>
<body>

  <div class="container">

    <h1>Петър Саркизов</h1>
    <p>Ученик в ПГКНМА</p>

    <h2>Относно мен</h2>
    <p>
      Казвам се Петър Саркизов и уча в ПГКНМА, 11а клас.
      Интересувам се от бизнес, а извън училище обичам да
      тренирам .
    </p>

    <h2>Умения</h2>
    <div>
      <span class="skill">Математика</span>
      <span class="skill">Английски език</span>
    </div>

    <h2>Проекти</h2>
    <div class="project">
      <strong>Проект 1</strong>
      <p>Портфолио на уеб сайт.</p>
    </div>

  </div>

</body>
</html>
